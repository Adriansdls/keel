id: 2
statement: A human-in-the-loop boundary that keeps appraisal/judgment supervised while
  automating search/extraction will produce synthesis that peer reviewers accept as
  epistemically valid.
rationale: 'Measured capability gradient: AI data extraction ~0.95 but risk-of-bias/appraisal
  judgment ~0.62, plus fabricated-citation risk and the Glass/Eysenck ''garbage-in''
  critique. Drawing the automation line at the right stage is what separates a credible
  tool from mega-silliness.'
confidence: 0.8
evidence_needed: Benchmark showing per-stage accuracy against an expert gold set,
  with a defined supervision protocol, where the human+AI pipeline matches or beats
  fully-manual synthesis on quality while cutting time substantially.
