id: 6
statement: Net relevant yield (absolute size of the pipeline's final relevant set
  vs gold size, conditioned on precision + adjudicated-novel fraction) is a better
  M1 success metric than recall-against-gold, and the pipeline delivers MORE genuine
  relevant papers than the human gold (yield ratio > 1 at high precision).
rationale: Recall/gold penalises finding relevant papers the incomplete gold lacks
  (the gold-incompleteness finding). If |final relevant set| > |gold| at verified
  precision, the review is MORE complete than the original. Absolute number alone
  is gameable -> must be conditioned on precision + adjudication.
confidence: 0.6
evidence_needed: 'Report per domain: recall vs gold; precision of final set; |final
  relevant set|/|gold|; adjudicated-genuine fraction of novel (non-gold) finds. Yield
  ratio > 1 at precision held high, across >=2 domains.'
