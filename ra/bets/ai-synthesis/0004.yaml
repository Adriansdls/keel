    a structural failure of the query-based paradigm. This makes citation-graph percolation
    the motivated alternative to a documented open failure, raising the value/relevance
    of the bet. It does not yet raise confidence in our threshold-separation claim
    itself (still unvalidated) — only modest +0.05. Evidence still needed: percolation
    recall vs human gold set on Egeland/CLIOARCH/savedrecs.'
