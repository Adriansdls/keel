id: 4
statement: Under semantic (embedding/LLM-judged) edge-weighting, the on-topic and
  off-topic sub-graphs of the citation network have SEPARABLE percolation thresholds
  — so frontier expansion with a prune cutoff between them yields a bounded, high-recall,
  question-specific corpus with a measurable recall guarantee.
rationale: Relevance-pruning a citation graph = bond percolation. Molloy–Reed (⟨k²⟩/⟨k⟩>2)
  and Cohen p_c=⟨k⟩/(⟨k²⟩−⟨k⟩) give the critical threshold at which a component shatters.
  If the off-topic subgraph shatters at a higher prune level than the on-topic subgraph,
  a cutoff between them gives provably bounded, high-recall search — the recall-guarantee
  pillar that separates systematic synthesis from sampling deep-research agents. This
  is the candidate core theorem of the paper.
confidence: 0.6000000000000001
evidence_needed: 'Percolation sweep on gold-standard corpora (Egeland 236, Buss PRISMA
  set, 999-record WoS export): vary semantic prune threshold, measure recall-vs-PRISMA
  and off-topic leak; test whether a separating threshold exists. Also test whether
  the archaeology citation graph is single-component or fragments by tradition/language
  (reachability failure mode).'
