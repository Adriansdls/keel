id: 3
statement: An agentic synthesis architecture proven on archaeology will generalise
  to other observational, heterogeneous, multilingual, gray-literature-heavy disciplines
  where classical meta-analysis has not taken hold.
rationale: Adrian's stated goal is a generalisable world-class synthesis process;
  archaeology is the hard test case (no established protocols, unstable units). If
  it works on the hardest substrate, the design transfers downward to easier ones.
confidence: 1.0
evidence_needed: A second-domain probe (or strong structural argument backed by the
  literature) showing the same architecture handles a non-archaeology heterogeneous
  corpus without redesign of its core.
