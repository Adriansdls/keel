id: 1
statement: Building corpus-scale conceptual harmonisation of contested analytical
  units (NACs / industries / technocomplexes) will deliver a categorically larger
  disciplinary transformation than automating the labour bottleneck alone.
rationale: 'Medicine/ecology already have standardised units, so AI there is mostly
  labour speedup. Archaeology''s distinctive pathology (Riede/CLIOARCH: same term,
  different thing across traditions/languages) is unsolved and blocks all downstream
  synthesis. Attacking it is both the novel research contribution and the MSCA differentiator.'
confidence: 1.0
evidence_needed: A demonstrator that detects same-term-different-thing (or different-term-same-thing)
  across a real multi-tradition corpus and produces a harmonised, versioned unit mapping
  that domain experts validate as more informative than the raw NAC labels.
