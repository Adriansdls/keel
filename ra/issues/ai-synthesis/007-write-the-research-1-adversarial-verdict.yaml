id: 7
title: Write the Research-1 adversarial verdict INTO the paper as a pre-registered
  obje
status: idea
priority: p1
area: research
why: Research 1 is a verbatim reviewer-2 pre-mortem ('archaeology least positioned;
  mismatch fundamental'). The strongest papers metabolize their hardest objection.
  Dedicate a section to the 'archaeology is the worst domain' argument, concede the
  EBM-pooling framing, then dissolve it via the meta-science / literature-as-data
  reframe + the empirical demonstration. Pre-empting the rejection in-text removes
  the reviewer's strongest weapon.
hypothesis: A paper that explicitly states and rebuts the 'least positioned' verdict
  will survive review better than one that ignores it; reviewers familiar with the
  Clark et al. 2025 / EBM-automation literature will reach for exactly this objection.
