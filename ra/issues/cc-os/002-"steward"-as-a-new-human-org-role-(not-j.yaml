id: 2
title: '"Steward" as a new human org role (not just an agent)'
status: idea
priority: p2
area: strategy
why: 'Adrian''s intuition: if the Steward agent makes sense, a HUMAN Steward role
  makes sense too — the person who owns an org''s AI-governance: reviews the agent''s
  amendment petitions, ratifies/dismisses, owns the constitution''s evolution. This
  is a signal the concept is real: the agent + the human role are the same function
  at two levels (the agent petitions; the human legislates — the bounded-autonomy
  invariant becomes an org structure). Potential category-defining framing for the
  consulting offer: every org adopting agentic coding needs a Steward (human + agent),
  the way they needed a DBA or an SRE. Worth developing as positioning, not just tech.'
hypothesis: The Steward (human role + agent) becomes a named, sellable function —
  "AI-governance steward" — that Zartis can staff/train/tool for clients. The human-ratifies
  / agent-petitions split maps cleanly onto an org accountability structure.
