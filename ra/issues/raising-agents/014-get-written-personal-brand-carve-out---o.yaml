id: 14
title: Get written personal-brand carve-out / overlap agreement with Zartis co-owners
status: idea
priority: p1
area: strategy
why: RA is built on Zartis-funded credits/tools, partly on work hours, same domain
  as Adrian's job — under standard IP-assignment/work-for-hire terms it may legally
  belong to Zartis by default. Adrian (1% owner) wants to keep the brand personally
  while funneling customers+students to Zartis and honoring the company. Goodwill
  is not structure; ambiguity becomes a dispute at any exit/departure. A one-page
  written carve-out now (cheap) prevents an expensive fight later. Load-bearing because
  everything else (positioning, funnel) is downstream of who owns the asset.
hypothesis: A signed one-pager (RA = Adrian's asset; Zartis provides credits/tools/time;
  RA delivers customer+talent funnel+association; Adrian retains brand on departure)
  removes the overlap risk without forcing personal/professional separation.
